steps:
  - name: 'python:3.11'
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "=== Installing dependencies ==="
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-cloud-secret-manager
        echo "=== Running SA key rotation script ==="
        python rotate_sa_keys.py
timeout: 900s
